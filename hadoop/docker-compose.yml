version: '3.8'

# Hadoop кластер с 1 NameNode и 3 DataNodes
# Соответствует требованию: 2-3 дочерних узла

services:
  namenode:
    image: apache/hadoop:3.3.6
    hostname: namenode
    container_name: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # Web UI
      - "9000:9000"   # HDFS
    env_file:
      - ./config/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - namenode_data:/tmp/hadoop-root/dfs/name
      - ./sample-data:/sample-data
    networks:
      - hadoop-net

  datanode1:
    image: apache/hadoop:3.3.6
    hostname: datanode1
    container_name: datanode1
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    volumes:
      - datanode1_data:/tmp/hadoop-root/dfs/data
    networks:
      - hadoop-net
    depends_on:
      - namenode

  datanode2:
    image: apache/hadoop:3.3.6
    hostname: datanode2
    container_name: datanode2
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    volumes:
      - datanode2_data:/tmp/hadoop-root/dfs/data
    networks:
      - hadoop-net
    depends_on:
      - namenode

  datanode3:
    image: apache/hadoop:3.3.6
    hostname: datanode3
    container_name: datanode3
    command: ["hdfs", "datanode"]
    env_file:
      - ./config/hadoop.env
    volumes:
      - datanode3_data:/tmp/hadoop-root/dfs/data
    networks:
      - hadoop-net
    depends_on:
      - namenode

  resourcemanager:
    image: apache/hadoop:3.3.6
    hostname: resourcemanager
    container_name: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"   # Resource Manager Web UI
    env_file:
      - ./config/hadoop.env
    networks:
      - hadoop-net
    depends_on:
      - namenode

  nodemanager1:
    image: apache/hadoop:3.3.6
    hostname: nodemanager1
    container_name: nodemanager1
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config/hadoop.env
    networks:
      - hadoop-net
    depends_on:
      - resourcemanager

  nodemanager2:
    image: apache/hadoop:3.3.6
    hostname: nodemanager2
    container_name: nodemanager2
    command: ["yarn", "nodemanager"]
    env_file:
      - ./config/hadoop.env
    networks:
      - hadoop-net
    depends_on:
      - resourcemanager

  historyserver:
    image: apache/hadoop:3.3.6
    hostname: historyserver
    container_name: historyserver
    command: ["mapred", "historyserver"]
    ports:
      - "19888:19888"  # History Server Web UI
    env_file:
      - ./config/hadoop.env
    networks:
      - hadoop-net
    depends_on:
      - resourcemanager

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:

networks:
  hadoop-net:
    driver: bridge

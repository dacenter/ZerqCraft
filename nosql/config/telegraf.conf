# Telegraf Configuration
# Сбор метеоданных из Kafka и запись в InfluxDB

[global_tags]
  environment = "production"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "telegraf-collector"
  omit_hostname = false

# Output: InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "meteo-secret-token-12345"
  organization = "meteo-org"
  bucket = "weather-data"
  timeout = "5s"

# Input: Kafka Consumer
[[inputs.kafka_consumer]]
  brokers = ["kafka-broker-1:29092", "kafka-broker-2:29093"]
  topics = ["weather-data"]
  consumer_group = "telegraf-weather-consumer"

  # Формат данных
  data_format = "json"

  # Тег из данных
  tag_keys = ["station_id"]

  # Поля для метрик
  json_string_fields = ["timestamp"]

  # Имя measurement
  name_override = "weather_measurements"

  # Время из сообщения
  json_time_key = "timestamp"
  json_time_format = "2006-01-02T15:04:05Z"

# Input: системные метрики InfluxDB
[[inputs.influxdb]]
  urls = ["http://influxdb:8086/debug/vars"]

# Input: метрики Kafka
[[inputs.kafka_consumer_legacy]]
  brokers = ["kafka-broker-1:29092"]
  topics = ["weather-alerts"]
  consumer_group = "telegraf-alerts-consumer"
  data_format = "json"
  tag_keys = ["station_id", "anomaly_type"]
  name_override = "weather_alerts"

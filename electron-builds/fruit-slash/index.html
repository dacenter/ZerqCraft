<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fruit Slash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .game-title {
            font-size: 56px;
            color: white;
            font-weight: 700;
        }

        .score-display {
            font-size: 64px;
            color: #ffd700;
            font-weight: 900;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .lives-display {
            font-size: 48px;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: calc(100% - 120px);
        }

        .btn-exit {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 15px 30px;
            font-size: 24px;
            background: rgba(255,0,0,0.7);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1000;
        }

        .btn-exit:hover {
            background: rgba(255,0,0,0.9);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <button class="btn-exit" onclick="closeGame()">✖ ESC</button>

        <div class="game-header">
            <div class="lives-display" id="lives">❤️ ❤️ ❤️</div>
            <h1 class="game-title">🍎 FRUIT SLASH</h1>
            <div class="score-display" id="score">0</div>
        </div>

        <canvas id="game-canvas"></canvas>
    </div>

    <script src="game.js"></script>
    <script>
        function closeGame() {
            window.close();
        }

        // ESC to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeGame();
            }
        });
    </script>
</body>
</html>
